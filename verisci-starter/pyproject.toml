[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verisci"
version = "0.1.0"
description = "Verifiable Scientific & Geospatial Benchmark Harness (GeoEval-BD) with Dual-Pass Ground-Truth Verifiers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Md. Mokammel Morshed", email = "meheran@meheran.dev" }
]
dependencies = [
  "inspect-ai>=0.3.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "geopandas>=1.0.0",
  "shapely>=2.0.0",
  "pyproj>=3.6.0",
  "rasterio>=1.3.10",
  "xarray>=2024.2.0",
  "scipy>=1.12.0",
  "sympy>=1.12",
  "scikit-learn>=1.4.0",
  "pyomo>=6.7.0",
  "highspy>=1.7.0",
  "pyyaml>=6.0.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src", "."]
